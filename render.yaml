services:
  - type: web
    name: opsflow-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run db:generate --workspace=server && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: opsflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

databases:
  - name: opsflow-db
    databaseName: opsflow
    user: opsflow
